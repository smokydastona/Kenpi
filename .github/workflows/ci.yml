name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development checks
        run: python -m pip install '.[dev]'
      - name: Check formatting
        run: ruff format --check kenpi tests
      - name: Lint
        run: ruff check kenpi tests
      - name: Compile
        run: python -m compileall -q kenpi tests
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Capability register is consistent with the runtime
        run: python -m kenpi.tools.register
      - name: Disconnected modules are justified; no copyleft dependencies
        run: python -m kenpi.tools.audit --strict --output "$RUNNER_TEMP/audit"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/kenpi-wheels .

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck deployment and OS image scripts
        run: |
          shellcheck \
            deploy/install-status.sh \
            deploy/rollback-status.sh \
            os-image/build.sh \
            os-image/stage-kenpi/prerun.sh \
            os-image/stage-kenpi/00-install-kenpi/01-run.sh \
            os-image/stage-kenpi/00-install-kenpi/02-run-chroot.sh

  systemd-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify kenpi-status.service
        run: |
          # systemd-analyze verify also checks that ExecStart's binary exists on disk.
          # That path only exists on a deployed host, so stand in a placeholder here
          # purely to exercise unit-file syntax, dependency, and sandboxing directive
          # checks; this does not validate kenpi's own runtime behavior.
          sudo mkdir -p /opt/kenpi/current/venv/bin
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/kenpi/current/venv/bin/python > /dev/null
          sudo chmod +x /opt/kenpi/current/venv/bin/python
          systemd-analyze verify ./deploy/kenpi-status.service

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run native firmware unit tests
        run: firmware/tools/run_native_tests.sh

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gateway for interop tests
        run: python -m pip install . cryptography
      - name: Run core tests (Kotlin client against the real Python gateway)
        working-directory: android
        env:
          KENPI_CORE_ONLY: "1"
          KENPI_INTEROP_PYTHON: python
          KENPI_INTEROP_ROOT: ${{ github.workspace }}
        run: ./gradlew :core:test --stacktrace
      # The app module (tests, lint, APKs, emulator smoke test) is built by android.yml.

  live-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools wireguard-go openssh-server iproute2
          sudo install -d -m 0755 -o "$USER" /run/sshd
          python -m pip install '.[dev]' cryptography
      - name: Unload Ubuntu's wg and wg-quick AppArmor profiles
        # The profile denies reading configs outside /etc/wireguard; the test keeps them in a temp state dir.
        # Runner images differ: unload only profiles that exist, so a missing one is not a failure.
        run: |
          for profile in /etc/apparmor.d/wg-quick /etc/apparmor.d/wg; do
            if [ -f "$profile" ]; then sudo apparmor_parser -R "$profile"; fi
          done
      - name: Real OpenSSH SFTP tests
        run: python -m unittest tests.test_sftp_live -v
      - name: Real WireGuard tunnel tests
        run: sudo -E env "PATH=$PATH" KENPI_LIVE_WG=1 python -m unittest tests.test_wireguard_live -v
