name: Android

on:
  push:
    paths: ["android/**", "kenpi/gateway/**", "kenpi/security/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "kenpi/gateway/**", "kenpi/security/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licences (the runner image ships the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway for interop tests
        run: python -m pip install . cryptography
      - name: Unit and interop tests (core talks to the real Python gateway)
        working-directory: android
        env:
          KENPI_INTEROP_PYTHON: python
          KENPI_INTEROP_ROOT: ${{ github.workspace }}
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build debug and release APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Checksums
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk out/
          (cd out && sha256sum *.apk | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kenpi-companion-apks
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kenpi-companion-apks
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r out/app-debug.apk
            adb shell am start -W -n com.kenpi.companion/.MainActivity
            sleep 5
            adb shell pidof com.kenpi.companion
            ! adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"
