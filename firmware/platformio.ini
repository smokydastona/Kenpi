; PlatformIO project file for the independent auxiliary controller
; firmware.
;
; `native` runs the host-executable protocol/state-machine unit tests
; under PlatformIO's native/Unity integration using this machine's own
; compiler (no Espressif toolchain or network access required beyond a
; local PlatformIO install). `esp32s3` is the real device target; it has
; NOT been built or flashed in this development environment, because
; doing so requires PlatformIO to download Espressif's toolchain packages,
; which this environment cannot reach. See firmware/README.md.
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; No default pin/board revision is assumed; see kenpi/board_config.h and
; firmware/README.md. This target has not been compiled in this repository's
; development environment.
