[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kenpi"
version = "0.1.0"
description = "A safety-first service foundation for the Kenpi camera gateway"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
kenpi = "kenpi.main:main"
kenpi-devices = "kenpi.tools.devices:main"
kenpi-backup = "kenpi.tools.backup:main"
kenpi-features = "kenpi.features:main"
kenpi-assist = "kenpi.assistant_cli:main"
kenpi-models = "kenpi.models_cli:main"

[project.optional-dependencies]
dev = ["ruff==0.11.2"]

[tool.setuptools.packages.find]
include = ["kenpi*"]

[tool.setuptools.package-data]
"kenpi.ui" = ["*.html", "*.css", "*.js"]
